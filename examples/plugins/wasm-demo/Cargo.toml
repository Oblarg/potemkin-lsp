[package]
name = "wasm-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference Potemkin plugin compiled to WebAssembly via the extism PDK"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
