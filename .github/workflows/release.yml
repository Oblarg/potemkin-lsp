name: Release VSIX

# Cross-compiles the potemkin proxy for every supported platform, bundles each
# native binary into a platform-specific VSIX (the WASM host + extension JS are
# built by `vscode:prepublish`), and uploads them. On a version tag it also
# attaches the VSIXs to a GitHub Release.
#
# The `bin/<vscode-target>/` dir naming matches the extension's
# `${process.platform}-${process.arch}` lookup and vsce's `--target` names.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.vscode_target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, vscode_target: darwin-arm64, rust_target: aarch64-apple-darwin }
          - { os: macos-14, vscode_target: darwin-x64, rust_target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, vscode_target: linux-x64, rust_target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, vscode_target: linux-arm64, rust_target: aarch64-unknown-linux-gnu, linux_cross: true }
          - { os: windows-latest, vscode_target: win32-x64, rust_target: x86_64-pc-windows-msvc }
          - { os: windows-latest, vscode_target: win32-arm64, rust_target: aarch64-pc-windows-msvc, experimental: true }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Set up aarch64 Linux cross linker
        if: matrix.linux_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Stage proxy binary
        shell: bash
        env:
          VSCODE_TARGET: ${{ matrix.vscode_target }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: bash editors/vscode/scripts/stage-binary.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension deps
        working-directory: editors/vscode
        run: npm ci

      - name: Package VSIX
        working-directory: editors/vscode
        shell: bash
        run: |
          npm run package -- --target "${{ matrix.vscode_target }}" \
            -o "potemkin-${{ matrix.vscode_target }}-${{ github.ref_name }}.vsix"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: potemkin-${{ matrix.vscode_target }}
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: vsix
          merge-multiple: true
      - name: Attach VSIXs to the release
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
